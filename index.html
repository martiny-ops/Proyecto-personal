<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <header class="bg-dark text-white p-3 mb-4">
    <div class="container d-flex justify-content-between align-items-center">
      <h1 class="h5 m-0">PLANIFICADOR DE TAREAS</h1>
    </div>
  </header>

  <main class="container">
    <div class="row g-4">

      <section class="col-md-5">
        <div class="card p-3">
          <h2 class="h6 fw-bold mb-3">[ FORMULARIO ]</h2>
          <form>
            <div class="mb-2">
              <label for="titulo" class="form-label small">Título</label>
              <input type="text" id="titulo" class="form-control form-control-sm" placeholder="Ej. Revisar propuesta">
            </div>

            <div class="mb-2">
              <label for="desc" class="form-label small">Descripción</label>
              <textarea id="desc" class="form-control form-control-sm" rows="2" placeholder="Descripción breve..."></textarea>
            </div>

            <div class="mb-2">
              <label for="fecha" class="form-label small">Fecha Límite</label>
              <input type="date" id="fecha" class="form-control form-control-sm">
            </div>

            <div class="mb-3">
              <label class="form-label small d-block">Prioridad</label>
              <div class="btn-group btn-group-sm w-100">
                <input type="radio" class="btn-check" name="prio" id="p1">
                <label class="btn btn-outline-secondary" for="p1">Alta</label>
                <input type="radio" class="btn-check" name="prio" id="p2" checked>
                <label class="btn btn-outline-secondary" for="p2">Media</label>
                <input type="radio" class="btn-check" name="prio" id="p3">
                <label class="btn btn-outline-secondary" for="p3">Baja</label>
              </div>
            </div>

            <button type="button" class="btn btn-dark btn-sm w-100 fw-bold">+ AGREGAR TAREA</button>
          </form>
        </div>
      </section>

      <section class="col-md-7">
        <div class="card p-3">
          <h2 class="h6 fw-bold mb-3">[ LISTA DE TAREAS ]</h2>

          <div class="btn-group btn-group-sm w-100 mb-3">
            <button class="btn btn-dark">Todas</button>
            <button class="btn btn-outline-secondary">Pendientes</button>
            <button class="btn btn-outline-secondary">Completadas</button>
          </div>

          <ul class="list-group list-group-flush border">
            <li class="list-group-item d-flex justify-content-between align-items-start p-2">
              <div class="d-flex gap-2">
                <input type="checkbox" class="form-check-input mt-1">
                <div>
                  <strong class="d-block small">Tarea1</strong>
                  <p class="text-muted mb-1 texto-descripcion">tarea1 en el formulario</p>
                </div>
              </div>
              <button class="btn btn-sm text-danger border-0">✕</button>
            </li>

            <li class="list-group-item d-flex justify-content-between align-items-start p-2 tarea-completada">
              <div class="d-flex gap-2">
                <input type="checkbox" class="form-check-input mt-1" checked>
                <div>
                  <strong class="d-block small">tarea 2</strong>
                  <span class="badge bg-light text-dark border">tarea 2 en el formulario</span>
                </div>
              </div>
              <button class="btn btn-sm text-danger border-0">✕</button>
            </li>
          </ul>

          <div class="mt-3 text-muted small">TOTAL: 2 TAREAS</div>
        </div>
      </section>

    </div>
  </main>

</body>
</html>
