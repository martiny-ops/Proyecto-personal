<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planificador de Tareas</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <link rel="stylesheet" href="./css/styles.css">
</head>

<body class="bg-dark text-light">

  <div class="container py-4">

    <h1 class="text-center mb-4 text-green">
      <span class="icon-chip"><i class="bi bi-journal-check"></i></span>Planificador de Tareas
    </h1>

    <!-- Formulario -->
    <div class="card mb-4 border-green">
      <div class="card-header d-flex align-items-center gap-2">
        <span class="icon-chip"><i class="bi bi-plus-circle-fill"></i></span>
        <h3 class="mb-0">Nueva Tarea</h3>
      </div>

      <div class="card-body">
        <form id="formTarea">

          <div id="alertaError" class="alert alert-danger d-none align-items-center gap-2" role="alert">
            <i class="bi bi-exclamation-triangle-fill flex-shrink-0 fs-5"></i>
            <div id="mensajeError"></div>
          </div>

          <div class="mb-3">
            <label class="form-label">Nombre de la tarea</label>
            <input type="text" id="nombreTarea" class="form-control" placeholder="Ingrese el nombre">
          </div>

          <div class="mb-3">
            <label class="form-label">Descripción</label>
            <textarea id="descripcion" class="form-control" rows="2" placeholder="Ingrese la descripción"></textarea>
          </div>

          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label class="form-label">Fecha</label>
              <input type="date" id="fechaTarea" class="form-control">
            </div>
            <div class="col-md-6">
              <label class="form-label">Estado</label>
              <select id="estadoTarea" class="form-select">
                <option value="" selected disabled>Seleccione un estado</option>
                <option value="Pendiente">Pendiente</option>
                <option value="En progreso">En progreso</option>
                <option value="Completada">Completada</option>
              </select>
            </div>
          </div>

          <!-- Botón Agregar -->
          <div class="d-grid col-8 col-md-5 mx-auto">
            <button id="btnAgregar" class="btn btn-green py-2" type="button">
              <i class="bi bi-check-lg me-1"></i>Agregar tarea
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Lista de tareas -->
    <h2 class="mb-3 text-green">
      <span class="icon-chip"><i class="bi bi-list-task"></i></span>Mis Tareas
    </h2>

    <!-- Contenedor dinámico de tareas -->
    <div id="tasksList" class="row g-3">
    </div>

  </div>

  <script src="./js/taskManager.js"></script>
  <script src="./js/index.js"></script>
</body>

</html>
